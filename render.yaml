services:
  - type: web
    name: pureglow-solutions
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
